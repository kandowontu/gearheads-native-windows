; LEVEL HACKING
; The section name has some information in it:
; LEVEL NAME=LEVEL
;             1-letter background code K(itchen) P(ond) G(arden) F(actory) etc
;               (used when picking a level of a given type)
;             3-digit level number for Tournament mode	  
;             2-letter toy code (disregarded)
;             1-digit Tournament intelligence (1=dumbest, 9=smartest)
;
; LeftGauge=Rectangle where the left windup gauge displays
; RightGauge=Rectangle where the right windup gauge displays
; LeftToyBox=Rectangle where the left toy to release is displayed
; RightToyBox=Rectangle where the right toy to release is displayed
; Gauge=Windup Gauge art to use (may be omitted)
;
; Name=Name of the level (displayed in Tournament mode)
; Bg=Background Image (must be 640x480 windows .BMP 256-color image)
; Song=Name(s) of the background music--choose 1 at random
; Friction=(between 1 and 15) (this doesn't do much)
; Ice=Collisions are elastic
; PuupProb=Average time between powerups, in some funny units (0=no powerups)
; Leveltoys=(Tournament only) Toys to use on this level (A-M)
; Obstacles=K
;	     2-digit obstacle number  73=Bug 74=Block 75-78=Moving Walls
;	       (51-53) Conveyor Belts 54=Ice Crack 55=Transporter
;              (56-59) Mud
;	     n
;            1 or 2 digit count (disregarded)
;=
;	     First number 0=Facing Left  1=Facing Right
;            Second number X-location (Screen is 640 wide)
;            Third number  Y-location (Screen is 480 high)
; 	
; The sounds in the sound section may be replaced with .wav files:
;  e.g.    oksound=c:\windows\ding.wav

